<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Análisis de los registros de violencia intrafamiliar en Colombia.">
    <title>{% block title %}Violencia intrafamiliar en Colombia{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-dark fixed-top site-navbar">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">Inicio</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#dimension-navigation"
            aria-controls="dimension-navigation"
            aria-expanded="false"
            aria-label="Abrir menú de navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="dimension-navigation">
            <ul class="navbar-nav ms-auto pt-2">
              <li><hr class="dropdown-divider border-light opacity-25"></li>
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'poblacional' %} active{% endif %}" {% if request.endpoint == 'poblacional' %}aria-current="page"{% endif %} href="{{ url_for('poblacional') }}">Dimensión poblacional</a>
              </li>
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'territorial' %} active{% endif %}" {% if request.endpoint == 'territorial' %}aria-current="page"{% endif %} href="{{ url_for('territorial') }}">Dimensión territorial</a>
              </li>
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'temporal' %} active{% endif %}" {% if request.endpoint == 'temporal' %}aria-current="page"{% endif %} href="{{ url_for('temporal') }}">Dimensión temporal</a>
              </li>
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'multivariada' %} active{% endif %}" {% if request.endpoint == 'multivariada' %}aria-current="page"{% endif %} href="{{ url_for('multivariada') }}">Dimensión relacional y multivariada</a>
              </li>
            </ul>
          </div>
      </div>
    </nav>

    <main class="container page-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        Proyecto académico de análisis de datos · Colombia
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
