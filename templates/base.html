<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Análisis de los registros de violencia intrafamiliar en Colombia.">
    <title>{% block title %}Violencia intrafamiliar en Colombia{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-dark fixed-top site-navbar">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">Inicio</a>
      </div>
    </nav>

    <div class="site-layout">
      <main class="container page-content">
        {% block content %}{% endblock %}
      </main>

      {% if request.endpoint != 'index' %}
        <aside class="dimension-sidebar" aria-label="Navegación por dimensiones">
          <h2 class="dimension-sidebar-title">Dimensiones</h2>
          <nav aria-label="Dimensiones de análisis">
            <ul class="nav nav-pills flex-column gap-1">
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'poblacional' %} active{% endif %}" {% if request.endpoint == 'poblacional' %}aria-current="page"{% endif %} href="{{ url_for('poblacional') }}">Poblacional</a>
              </li>
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'territorial' %} active{% endif %}" {% if request.endpoint == 'territorial' %}aria-current="page"{% endif %} href="{{ url_for('territorial') }}">Territorial</a>
              </li>
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'temporal' %} active{% endif %}" {% if request.endpoint == 'temporal' %}aria-current="page"{% endif %} href="{{ url_for('temporal') }}">Temporal</a>
              </li>
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'multivariada' %} active{% endif %}" {% if request.endpoint == 'multivariada' %}aria-current="page"{% endif %} href="{{ url_for('multivariada') }}">Relacional y multivariada</a>
              </li>
            </ul>
          </nav>
        </aside>
      {% endif %}
    </div>

    <footer class="site-footer">
      <div class="container">
        Proyecto académico de análisis de datos · Colombia
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
